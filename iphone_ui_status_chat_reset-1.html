* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#101116; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif; color:white; }
body { display:flex; align-items:center; justify-content:center; }
.phone { position:relative; width:min(390px,100vw); height:min(844px,100dvh); aspect-ratio:390/844; overflow:hidden; background:#111; border:5px solid #252529; border-radius:54px; box-shadow:0 25px 90px #000a; isolation:isolate; }
.screen { touch-action:none; position:absolute; inset:0; overflow:hidden; background-image:var(--wallpaper); background-size:cover; background-position:center; }
.screen::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,#07101b26 0%,#07101b05 45%,#0005 100%); pointer-events:none; }
.status { position:absolute; z-index:5; top:15px; left:26px; right:25px; display:flex; align-items:center; justify-content:space-between; font-size:14px; font-weight:650; text-shadow:0 1px 4px #0008; }
.status-right { display:flex; align-items:center; gap:5px; }
.signal { display:flex; align-items:flex-end; gap:2px; height:13px; }
.signal i { display:block; width:3px; background:white; border-radius:2px; }
.signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:7px}.signal i:nth-child(3){height:10px}.signal i:nth-child(4){height:12px}
.wifi { width:15px;height:11px; border:2px solid white; border-color:white transparent transparent transparent; border-radius:50%; position:relative; transform:translateY(3px); }
.wifi:after {content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:white;left:3.5px;top:2px}
.battery { width:23px;height:11px;border:1.5px solid white;border-radius:3px;position:relative;padding:1.5px; }
.battery:after {content:"";position:absolute;right:-4px;top:2.5px;width:2px;height:4px;background:white;border-radius:0 2px 2px 0}
.battery span {display:block;height:100%;width:78%;background:white;border-radius:1px}
.lock-content { position:absolute; z-index:2; top:14%; width:100%; text-align:center; text-shadow:0 2px 16px #0007; }

let currentRoom='manager', managerRead=false;
const scroll=$('conversationScroll');

const temporaryMessages={};
const temporaryReplies={};
const stored=room=>temporaryMessages[room]||[];
function appendDate(date){
 const d=document.createElement('div');d.className='message-date';d.textContent=date;scroll.appendChild(d);
}
function appendBubble(who,body,translation,time){
 const row=document.createElement('div');row.className='message-row '+(who==='wo'?'mine':'theirs');
 if(who!=='wo'){
  const av=document.createElement('span');av.className='message-avatar';
  const src=avatarFor(who==='manager'?'매니저 형(经纪人)':who==='hy'?'亨裕':who==='jeoi'?'저이🐰':who==='hao'?'Hao':who==='yan'?'顏秋越':who==='su'?'薛苏仁':who==='chen'?'이첸':who);
  if(src){const img=document.createElement('img');img.src=src;av.appendChild(img);}
  else av.textContent='👤';
  row.appendChild(av);
 }
 const bodyEl=document.createElement('div');bodyEl.className='message-body';
 if(who!=='wo'){
  const name=document.createElement('div');name.className='message-sender';name.textContent=who==='manager'?roomNames.manager:who==='hy'?roomNames.hy:who==='jeoi'?roomNames.jeoi:who==='hao'?roomNames.hao:who==='yan'?roomNames.yan:who==='su'?roomNames.su:who==='chen'?roomNames.chen:who;bodyEl.appendChild(name);
 }
 const bubble=document.createElement('div');bubble.className='message-bubble';bubble.textContent=body;bubble.style.whiteSpace='pre-wrap';bodyEl.appendChild(bubble);
 if(translation){const t=document.createElement('div');t.className='message-translation';t.textContent=translation;bodyEl.appendChild(t);}
 const timeEl=document.createElement('div');timeEl.className='message-time';timeEl.textContent=time||'';
 if(who==='wo'){row.appendChild(timeEl);row.appendChild(bodyEl);}else{row.appendChild(bodyEl);row.appendChild(timeEl);}
 scroll.appendChild(row);
}
function appendCall(duration,time){
 const item=document.createElement('div');item.className='call-history';
 item.innerHTML='<span class="call-symbol">☎</span><span class="call-details"><strong>음성 통화</strong><small></small></span><span class="call-duration"></span>';
 item.querySelector('.call-details small').textContent=time+' · 통화 종료';
 item.querySelector('.call-duration').textContent=duration;
 scroll.appendChild(item);
}
function renderRoom(){
 scroll.replaceChildren();
 const original=currentRoom==='manager'?chatMessages:currentRoom==='hy'?hyMessages:currentRoom==='jeoi'?jeoiMessages:currentRoom==='hao'?haoMessages:currentRoom==='yan'?yanMessages:currentRoom==='su'?suMessages:currentRoom==='chen'?chenMessages:groupMessages;
 let lastDate='';
 original.forEach(([fullTime,who,body,translation])=>{
  const date=fullTime.split(/ 오전 | 오후 /)[0];
  if(date!==lastDate){appendDate(date);lastDate=date;}
  if(who==='call')appendCall(body,fullTime.split(/ 오전 | 오후 /)[1]);else appendBubble(who,body,translation,fullTime.split(/ 오전 | 오후 /)[1]);
 });
 const saved=stored(currentRoom);
 saved.forEach(m=>{
  const date=m.date||'10월 24일';
  if(date!==lastDate){appendDate(date);lastDate=date;}
  appendBubble('wo',m.text,null,m.time);
 });
 try{
 const received=temporaryMessages['_received_'+currentRoom]||[];
 if(Array.isArray(received))received.forEach(m=>{appendDate(m.date);appendBubble(currentRoom,m.text,null,m.time);});
 }catch(e){}
 scroll.scrollTop=scroll.scrollHeight;
}
function openRoom(room){
 currentRoom=room;
 document.querySelector('.conversation-header strong').textContent=roomNames[room];
 $('conversationView').style.display='block';
 $('chatHeading').style.visibility='hidden';
 $('chatHome').style.display='none';
 $('friendsPane').style.display='none';
 $('chatsPane').style.display='none';
 document.querySelector('.chat-tabs').style.display='none';
 if(room==='manager'){managerRead=true;$('unreadBadge').style.display='none';}
 if(room==='su'){$('suUnreadBadge').style.display='none';}
 if(room==='group'){$('groupUnreadBadge').style.display='none';}
 renderRoom();
 if(room==='manager')setTimeout(startIncomingCall,450);
}
$('managerConversation').addEventListener('click',()=>openRoom('manager'));

(function(){
 const form=$('messageForm'),input=$('messageInput'),send=$('sendMessage');
 input.addEventListener('input',()=>{send.disabled=!input.value.trim();input.style.height='38px';input.style.height=Math.min(input.scrollHeight,105)+'px';});
 input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!send.disabled)form.requestSubmit();}});
 form.addEventListener('submit',e=>{
  e.preventDefault();const value=input.value.trim();if(!value)return;
  const now=new Date();
  const date=now.toLocaleDateString('ko-KR',{month:'long',day:'numeric'});
  const time=now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});
  const saved=stored(currentRoom);const lastDate=saved.length?saved[saved.length-1].date:'';
  if(date!==lastDate)appendDate(date);
  appendBubble('wo',value,null,time);
  temporaryMessages[currentRoom]=[...saved,{text:value,date,time}];
  const repliedRoom=currentRoom;
  const responseKey='wo_autoreply_once_'+repliedRoom;
  if((repliedRoom==='manager'||repliedRoom==='su') && !temporaryReplies[repliedRoom]){
   temporaryReplies[repliedRoom]=true;
   setTimeout(()=>{
    const reply=repliedRoom==='manager'?'일단 내거라 하긴했으니까 이따 가져가라..':'🤔';
    const nowReply=new Date();
    const replyDate=nowReply.toLocaleDateString('ko-KR',{month:'long',day:'numeric'});
    const replyTime=nowReply.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});
    const key='wo_received_messages_v1_'+repliedRoom;
    (temporaryMessages['_received_'+repliedRoom] ||= []).push({text:reply,date:replyDate,time:replyTime});
    if(currentRoom===repliedRoom){appendBubble(repliedRoom,reply,null,replyTime);scroll.scrollTop=scroll.scrollHeight;}
    const row=document.querySelector('#'+(repliedRoom==='manager'?'managerConversation':'suConversation')+' .conversation-copy small');
    if(row)row.textContent=reply;
   },3000);
  }
  input.value='';input.style.height='38px';send.disabled=true;scroll.scrollTop=scroll.scrollHeight;input.focus();
 });
 if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{if(document.activeElement===input)scroll.scrollTop=scroll.scrollHeight;});
})();

// Fictional call simulation: audio will be added after the voice recording is provided.
let callPhase='idle',callStartedAt=0,callTick=null,ringTimer=null,callTriggered=false,audioContext=null;
const callBanner=$('incomingCall'),callScreen=$('callFullscreen'),callLabel=$('callStateLabel');
function callClock(){const n=new Date();$('callStatusClock').textContent=n.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});}
function ringOnce(){
 try{
  audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();
  if(audioContext.state==='suspended')audioContext.resume();
  const now=audioContext.currentTime;
  for(let j=0;j<3;j++){const osc=audioContext.createOscillator(),gain=audioContext.createGain();
    osc.type='sine';osc.frequency.value=[659,784,988][j];gain.gain.setValueAtTime(.0001,now+j*.17);
    gain.gain.exponentialRampToValueAtTime(.045,now+j*.17+.025);gain.gain.exponentialRampToValueAtTime(.0001,now+j*.17+.145);
    osc.connect(gain).connect(audioContext.destination);osc.start(now+j*.17);osc.stop(now+j*.17+.16);
  }
 }catch(e){}
}
function stopRing(){if(ringTimer){clearInterval(ringTimer);ringTimer=null;}}
function startIncomingCall(){
 if(callTriggered||callPhase!=='idle')return;
 callTriggered=true;callPhase='ringing';callBanner.classList.add('visible');
 const img=document.querySelector('.friend-list .friend-row .friend-name');
 const yan=Array.from(document.querySelectorAll('.friend-list .friend-row')).find(r=>r.querySelector('.friend-name')?.textContent.trim()==='顏秋越');

 ringOnce();ringTimer=setInterval(ringOnce,3000);
}
function expandCall(){if(callPhase==='idle')return;callBanner.classList.remove('visible');callScreen.classList.add('visible');callClock();$('fullscreenAnswerSlot').style.display=callPhase==='ringing'?'flex':'none';}
function acceptCall(){
 if(callPhase!=='ringing')return;stopRing();callPhase='connected';callStartedAt=Date.now();
 callBanner.classList.remove('visible');callScreen.classList.add('visible');$('fullscreenAnswerSlot').style.display='none';
 function update(){const t=Math.floor((Date.now()-callStartedAt)/1000);callLabel.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');callClock();}
 update();callTick=setInterval(update,1000);
 // Voice audio can be attached here once the user supplies the recording.
}
function endCall(){
 stopRing();if(callTick)clearInterval(callTick);callTick=null;
 callBanner.classList.remove('visible');callScreen.classList.remove('visible');
 callPhase='idle';callLabel.textContent='휴대전화 연결 중...';
}
$('incomingExpand').addEventListener('click',expandCall);
$('bannerDecline').addEventListener('click',endCall);
$('bannerAccept').addEventListener('click',acceptCall);
$('fullscreenAnswer').addEventListener('click',acceptCall);
$('endCall').addEventListener('click',endCall);
